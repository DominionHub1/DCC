# Builds the site and publishes it on GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# Runs on every push to main, after the Sunday YouTube sync, daily (so dates and
# "This Week at DCC" stay current), and by hand from the Actions tab.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Sync YouTube messages]
    types: [completed]
  schedule:
    - cron: '17 4 * * *'   # daily, early morning UK time
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Served from https://<owner>.github.io/DCC/ this is "/DCC"; with a custom domain it is empty.
      - name: Apply base path
        run: node scripts/apply-base-path.mjs "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
